[project]
name = "azml-ecf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-ai-ml>=1.35.2",
    "azure-identity>=1.27.0",
    "azure-storage-blob>=12.31.1",
    "azure-storage-file-datalake>=12.26.1",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
azml-ecf = "azml_ecf:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
